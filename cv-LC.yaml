work_experience:
- role: Software Developer
  company: BUGSENG s.r.l.
  period:
    from: 2024-09-02
    to: present
  location: Pisa, Italy

  short_description: Systems and developer-tooling engineer working on static analysis, language tooling, and safety-critical software.

  description: |
    I develop systems and developer tooling around ECLAIR, BUGSENG's static-analysis platform for C and C++ software, with a focus on safety-critical development, coding-standard compliance, and making complex analysis results accessible to developers.

    My work spans multiple layers of the product, including static-analysis infrastructure, language and IDE tooling, command-line interfaces, automation, build and release integration, qualification material, and experimental product capabilities. I regularly prototype new approaches, evaluate them on realistic use cases, and carry successful ideas toward production-quality implementations.

    A recent example is ECLAIR's Model Context Protocol (MCP) integration, which I designed and implemented from prototype to an internally release-ready system in roughly two weeks of part-time development. The server exposes large analysis databases and technical documentation to AI clients through structured tools and progressive querying rather than unbounded context dumps. The work included the Rust implementation, query and pagination architecture, documentation search, licensing integration, diagnostics, Windows/Linux/MacOS support, protocol-level fixtures, and a distributable self-test harness.

    I have also worked on language tooling, IDE integrations, static-analysis checks and infrastructure, qualification workflows, and architectural prototypes across a mixed C++, Rust, Prolog, Python, JavaScript, and Java codebase.

  main_technologies:
  - title: C & C++
    desc: Core development and integration work around ECLAIR and C/C++ static-analysis infrastructure.
    long_description: |
      C and C++ are central both to ECLAIR's implementation and to the software it analyzes. My work includes product development, integration work, build and platform issues, and tooling around large industrial C and C++ codebases, particularly in safety-critical and standards-driven environments.

  - title: Rust
    desc: Systems and developer-tooling development, including command-line tools, protocol servers, data access, and architectural prototypes.
    long_description: |
      I use Rust for standalone systems and developer-tooling components where strong typing, reliability, and rapid iteration are particularly valuable. My professional Rust work includes protocol servers, command-line interfaces, structured access to analysis data, build and platform integration, testing infrastructure, and interoperability with existing C and C++ code.

  - title: Model Context Protocol (MCP)
    desc: Designed and implemented ECLAIR's production-oriented MCP integration for AI-assisted static-analysis workflows.
    long_description: |
      I designed the architecture and implemented ECLAIR's MCP server in Rust. It allows AI clients to progressively navigate static-analysis databases, diagnostics, source excerpts, manuals, and project documentation through structured tools.

      The design is intended to work with large analyses without exposing entire databases to the model at once. It includes filtering and grouping primitives, bounded pagination, documentation search, protocol-level fixture tests, licensing integration, diagnostics, and a self-contained validation harness.

  - title: Static analysis
    desc: Development of tooling and infrastructure for analyzing C and C++ software without executing it.
    long_description: |
      Static analysis is the main technical domain of my professional work. I work with tooling that combines programming-language knowledge, program analysis, rule-based reasoning, diagnostics, and developer workflows to detect defects and support compliance in large C and C++ projects.

  - title: Safety-critical standards
    desc: Tooling and workflows supporting MISRA, CERT, AUTOSAR, and related C/C++ coding standards.
    long_description: |
      Much of my work is connected to software developed under strict coding standards and qualification requirements. This includes tooling for standards such as MISRA C, MISRA C++, CERT C/C++, and AUTOSAR C++14, together with the infrastructure required to make findings understandable, reviewable, and usable in engineering workflows.

  - title: Prolog
    desc: Declarative implementation of analysis logic, rules, constraints, and relationships.
    long_description: |
      I use Prolog in parts of the static-analysis stack where rules and relationships can be expressed naturally in declarative form. This includes working with analysis knowledge, configuration, and rule-oriented logic.

  - title: Python
    desc: Automation, scripting, experiments, data processing, and development support.
    long_description: |
      I use Python for automation, glue code, experiments, data transformation, and small internal tools around larger systems.

  - title: Lua
    desc: Embedded scripting and automation for developer tooling.
    long_description: |
      I have worked with Lua in tooling contexts where a lightweight embedded scripting environment is useful for configuration, automation, or extensibility.

  - title: JavaScript
    desc: Web and developer-facing interfaces around analysis tooling.
    long_description: |
      I use JavaScript and related web technologies for developer-facing interfaces, integrations, documentation, and tooling around ECLAIR.

  - title: Java
    desc: IDE and development-environment integration.
    long_description: |
      I have used Java for IDE-related integration work and developer tooling, particularly where integration with existing Java-based development environments is required.

  - title: Docker
    desc: Reproducible build, testing, release, and deployment environments.
    long_description: |
      I use Docker in build and release workflows, reproducible development environments, CI-related tasks, and cross-platform packaging and integration work.

