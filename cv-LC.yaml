# role: R&D (part-time / project-based)
- role: R&D (Software and Algorithms)
  company: Scanny3D s.r.l.
  period:
    from: "2018"
    to: "2024"
  location: Italy

  short_description: Software, algorithms, and hardware integration for structured-light 3D scanning and reconstruction.

  description: |
    Contributed to research and development of structured-light 3D scanning systems, combining computer vision, numerical algorithms, acquisition software, calibration, and practical hardware integration.

    My work spanned the full reconstruction pipeline, from camera/projector acquisition and calibration to point-cloud generation and 3D reconstruction, together with experimental work involving cameras, projectors, electronics, mechanics, and 3D printing.

    This experience introduced me early to engineering problems that cross the boundary between software, mathematical algorithms, physical measurement, and real-world hardware.

  main_technologies:
  - title: C++
    desc: Core application and algorithm development for acquisition, calibration, and 3D reconstruction.
    long_description: |
      Used C++ for performance-sensitive application logic and reconstruction algorithms, including work with existing and legacy codebases.

  - title: 3D reconstruction
    desc: Geometric reconstruction from image-based measurements and structured-light acquisition.
    long_description: |
      Worked on algorithms and workflows for recovering three-dimensional geometry from structured-light measurements, including calibration, point-cloud processing, and surface reconstruction.

  - title: Computer vision
    desc: Image processing and measurement-oriented vision algorithms.
    long_description: |
      Developed and experimented with computer-vision techniques used for camera/projector calibration, structured-light decoding, geometric measurement, and reconstruction.

  - title: Hardware integration
    desc: Integration of software with cameras, projectors, electronics, mechanics, and custom scanning hardware.
    long_description: |
      Worked directly with the physical side of scanning systems, integrating software with cameras, projectors, electronics, mechanical components, and prototyped hardware.

